services:
  mongodb:
    image: mongo:7.0
    container_name: travelshare-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: |
        mongosh --port 27017 --quiet --eval "
        try {
          rs.status();
        } catch (err) {
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
        }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.2-alpine
    container_name: travelshare-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  redis_data:
